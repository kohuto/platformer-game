<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jednoduchá 2D plošinovka vytvořená pomocí Phaseru."
    />
    <title>Platformer Game</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="game-page">
      <header class="game-header">
        <p class="eyebrow">PHASER PLATFORMER</p>
        <h1>Skok do dobrodružství</h1>
        <p class="instructions">Pohyb: ← → nebo A / D &middot; Skok: ↑, W nebo mezerník</p>
      </header>

      <div id="game-container" aria-label="Herní plocha"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
